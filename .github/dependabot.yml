version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
      tooling:
        patterns: ["com.google.errorprone*", "com.uber.nullaway*", "com.diffplug*", "com.puppycrawl*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      tanstack:
        patterns: ["@tanstack/*"]
      lint:
        patterns: ["eslint*", "@eslint*", "typescript-eslint", "prettier"]
      storybook:
        patterns: ["storybook", "@storybook/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
