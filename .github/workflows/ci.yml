name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (format, compile, tests, contract)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Format and architecture checks
        run: ./gradlew --console=plain spotlessCheck checkstyleMain checkstyleTest
      - name: Compile and test (Testcontainers PostgreSQL)
        run: ./gradlew --console=plain compileJava compileTestJava test
      - name: Committed OpenAPI document matches the code
        working-directory: .
        run: git diff --exit-code -- api/openapi/backend.json
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/**/build/reports/tests/
          if-no-files-found: ignore

  web:
    name: Web, tokens and SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install (builds the SDK through prepare)
        run: pnpm install --frozen-lockfile
      - name: Generated SDK matches the committed OpenAPI document
        run: pnpm --filter @alliedpayroll/api-client generate && git diff --exit-code -- api/sdk/typescript/src
      - name: Design tokens build is committed and fresh
        run: pnpm --filter @alliedpayroll/design-tokens check
      - name: Typecheck, lint, format, unit tests
        run: pnpm --filter @alliedpayroll/web check
      - name: Production build
        run: pnpm --filter @alliedpayroll/web build
      - name: Storybook build
        run: pnpm --filter @alliedpayroll/web build-storybook
      - name: Conventional commits on the pull request
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  mobile:
    name: Mobile (format, analyze, tests, APK, Dart SDK contract)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALLIED_FLUTTER: host
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          cache: true
      - name: Generated Dart SDK matches the committed OpenAPI document
        run: |
          curl -sSL -o /tmp/openapi-generator-cli.jar https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.27.0/openapi-generator-cli-7.27.0.jar
          OPENAPI_GENERATOR_JAR=/tmp/openapi-generator-cli.jar scripts/dart-sdk
          git diff --exit-code -- api/sdk/dart
      - name: Design tokens Flutter package
        run: |
          MOBILE_DIR=design-tokens/flutter scripts/flutter pub get
          MOBILE_DIR=design-tokens/flutter scripts/flutter analyze
          MOBILE_DIR=design-tokens/flutter scripts/flutter test
      - name: Generate (l10n, Riverpod)
        run: |
          scripts/flutter pub get
          scripts/flutter gen-l10n
          scripts/dart run build_runner build --delete-conflicting-outputs
      - name: Format, analyze, custom lints
        run: |
          scripts/dart format --output=none --set-exit-if-changed lib test
          scripts/flutter analyze
          scripts/dart run custom_lint
      - name: Unit, widget and golden tests
        run: scripts/flutter test
      - name: Debug APK
        run: scripts/flutter build apk --debug --dart-define-from-file=env/dev.json
      - name: Golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-golden-failures
          path: mobile/test/**/failures/
          if-no-files-found: ignore

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, web, mobile]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
