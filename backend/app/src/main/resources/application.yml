spring:
  application:
    name: alliedpayroll-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alliedpayroll}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:app}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      pool-name: app
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alliedpayroll}
    user: ${DB_MIGRATE_USER:migrate_user}
    password: ${DB_MIGRATE_PASSWORD:migrate}
    init-sqls: SET ROLE migrate
    default-schema: flyway
    create-schemas: true
    locations:
      - classpath:db/migration/platform
      - classpath:db/migration/tenant
      - classpath:db/migration/identity
      - classpath:db/migration/audit
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  modulith:
    events:
      completion-mode: archive
      republish-outstanding-events-on-restart: true
      jdbc:
        schema: platform
        schema-initialization:
          enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://auth.localhost:8081/realms/alliedpayroll}
          jwk-set-uri: ${OIDC_ISSUER:http://auth.localhost:8081/realms/alliedpayroll}/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            client-id: ${OIDC_WEB_CLIENT_ID:alliedpayroll-web}
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/auth/callback"
            scope: openid,profile,email,organization
        provider:
          keycloak:
            # Explicit endpoints, so the backend starts without reaching Keycloak first.
            authorization-uri: ${OIDC_ISSUER:http://auth.localhost:8081/realms/alliedpayroll}/protocol/openid-connect/auth
            token-uri: ${OIDC_ISSUER:http://auth.localhost:8081/realms/alliedpayroll}/protocol/openid-connect/token
            jwk-set-uri: ${OIDC_ISSUER:http://auth.localhost:8081/realms/alliedpayroll}/protocol/openid-connect/certs
            user-info-uri: ${OIDC_ISSUER:http://auth.localhost:8081/realms/alliedpayroll}/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username
  jackson:
    # Absent, not null: the generated SDKs type optional fields as missing (headless-api §7).
    default-property-inclusion: non_null
  messages:
    basename: i18n/platform/messages,i18n/tenant/messages,i18n/identity/messages,i18n/audit/messages
    fallback-to-system-locale: false
    encoding: UTF-8
  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8088}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: ALLIED_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
      timeout: 8h
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**,/auth/**
  default-produces-media-type: application/json

alliedpayroll:
  security:
    mobile-client-id: ${OIDC_MOBILE_CLIENT_ID:alliedpayroll-mobile}
    kiosk-client-id: ${OIDC_KIOSK_CLIENT_ID:alliedpayroll-kiosk}
  oidc:
    end-session-uri: ${OIDC_ISSUER:http://auth.localhost:8081/realms/alliedpayroll}/protocol/openid-connect/logout
  identity:
    keycloak:
      base-url: ${KEYCLOAK_URL:http://auth.localhost:8081}
      realm: ${KEYCLOAK_REALM:alliedpayroll}
      client-id: ${KEYCLOAK_BACKEND_CLIENT_ID:alliedpayroll-backend}
      client-secret: ${KEYCLOAK_BACKEND_SECRET:}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{tenant:-}] %logger{36} - %msg%n"
  level:
    com.alliedpayroll: INFO
