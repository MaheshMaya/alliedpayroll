server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The browser only ever talks to this origin. API and session endpoints are proxied to the
    # backend with the tenant host preserved, so cookies stay first-party and the backend can
    # resolve the tenant from the host name.
    location ~ ^/(api|auth|v3)/ {
        proxy_pass http://backend-api:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    # Hashed assets are immutable; index.html must always be revalidated so a deploy is picked up.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
