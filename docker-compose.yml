name: alliedpayroll

# One command for the whole stack:  docker compose up --build
# Browser URLs use *.localhost hosts, which resolve to the loopback address without a hosts file:
#   web       http://sentinel.localhost:5173   http://nimbus-it.localhost:5173
#   api       http://sentinel.localhost:8088/api/v1/bootstrap
#   keycloak  http://auth.localhost:8081   (admin console: admin / admin)

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alliedpayroll
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alliedpayroll"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # The same hostname for browsers (via the published port) and for the backend (via the
      # network alias below), so the token issuer is one value everywhere.
      KC_HOSTNAME: http://auth.localhost:8081
      KC_HTTP_PORT: "8081"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8081"
    networks:
      default:
        aliases:
          - auth.localhost
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  keycloak-seed:
    image: quay.io/keycloak/keycloak:26.8.2
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/seed/seed-keycloak.sh"]
    environment:
      KEYCLOAK_URL: http://auth.localhost:8081
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-Welcome@123}
    volumes:
      - ./deploy/keycloak:/seed:ro
    restart: "no"

  backend-api:
    build:
      context: ./backend
    image: alliedpayroll/backend:local
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/alliedpayroll
      OIDC_ISSUER: http://auth.localhost:8081/realms/alliedpayroll
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8088/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  backend-batch:
    image: alliedpayroll/backend:local
    environment:
      SPRING_PROFILES_ACTIVE: local,batch
      DB_URL: jdbc:postgresql://postgres:5432/alliedpayroll
      OIDC_ISSUER: http://auth.localhost:8081/realms/alliedpayroll
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    depends_on:
      backend-api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: alliedpayroll/web:local
    ports:
      - "5173:80"
    depends_on:
      backend-api:
        condition: service_healthy

  # Toolchain for local checks, so nothing depends on a JDK, Gradle or an IDE on the host:
  #   scripts/gradle spotlessCheck compileJava test
  # Sources are synced into the backend-work volume because Gradle cannot run on the Windows bind
  # mount; Testcontainers starts sibling containers through the mounted Docker socket.
  backend-tools:
    profiles: [tools]
    image: eclipse-temurin:25-jdk
    working_dir: /work
    entrypoint: ["bash", "/work/scripts/gradle-in-container.sh"]
    command: ["--version"]
    environment:
      GRADLE_USER_HOME: /gradle-home
      TESTCONTAINERS_RYUK_DISABLED: "true"
    volumes:
      - .:/work
      - gradle-home:/gradle-home
      - backend-work:/build
      - /var/run/docker.sock:/var/run/docker.sock

  # Flutter and Dart for mobile/, api/sdk/dart and design-tokens/flutter:
  #   scripts/flutter analyze      scripts/flutter test      scripts/dart-sdk
  # Same volume arrangement as backend-tools: sources synced into mobile-work, pub and Gradle caches kept.
  mobile-tools:
    profiles: [tools]
    image: ghcr.io/cirruslabs/flutter:3.44.0
    working_dir: /work
    entrypoint: ["bash", "/work/scripts/mobile-in-container.sh"]
    command: ["flutter", "--version"]
    environment:
      PUB_CACHE: /pub-cache
      GRADLE_USER_HOME: /gradle-home
      MOBILE_DIR: mobile
    volumes:
      - .:/work
      - pub-cache:/pub-cache
      - gradle-home:/gradle-home
      - mobile-work:/build

volumes:
  pgdata:
  keycloak-data:
  gradle-home:
  backend-work:
  pub-cache:
  mobile-work:
