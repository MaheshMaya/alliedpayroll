name: allied_payroll
description: Allied Payroll for employees, supervisors and kiosks. One app, the mode is chosen at runtime.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  allied_api:
    path: ../api/sdk/dart
  allied_tokens:
    path: ../design-tokens/flutter
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_appauth: ^13.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  intl: ^0.20.2
  riverpod_annotation: ^4.0.0
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  custom_lint: ^0.8.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true
